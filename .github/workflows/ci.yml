name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run all tests against real PostgreSQL (Testcontainers)
        run: ./mvnw -B -ntp verify

      - name: Publish measured concurrency results
        if: always()
        run: |
          if [ -f target/concurrency-report/report.md ]; then
            cat target/concurrency-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/concurrency-report/
            target/instances/
          if-no-files-found: ignore

  end-to-end:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Create throwaway secrets
        run: |
          {
            cp .env.example .env
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "STOCKGUARD_JWT_SECRET=$(openssl rand -hex 32)"
            echo "STOCKGUARD_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> .env

      - name: Build and start two instances
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Race real requests across both instances
        run: |
          export $(grep '^STOCKGUARD_ADMIN_PASSWORD=.' .env | tail -n 1)
          scripts/simulate.sh 1 100
          scripts/simulate.sh 10 100

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down --volumes
